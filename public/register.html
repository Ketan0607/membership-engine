<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Membership Engine</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Membership<span class="highlight">Engine</span></a>
    </nav>

    <div class="auth-container">
        <!-- Registration Form -->
        <div class="auth-card" id="registerCard">
            <h2>Create Account</h2>
            <p class="subtitle">Join today to start accessing our premium content.</p>

            <div id="registerAlert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" id="regBtn">Register Now</button>
            </form>
            <div class="auth-switch">
                Already have an account? <a href="#" id="showLogin">Log In</a>
            </div>
        </div>

        <!-- Login Form -->
        <div class="auth-card hidden" id="loginCard">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to view your dashboard and content.</p>

            <div id="loginAlert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginSubmitBtn">Log In</button>
            </form>
            <div class="auth-switch">
                Don't have an account? <a href="#" id="showRegister">Register</a>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
